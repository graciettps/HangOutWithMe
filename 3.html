<!DOCTYPE html>
<html lang="zh">
    
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=M+PLUS+Rounded+1c&family=Zen+Maru+Gothic&display=swap">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要不要和我出去玩?</title>
    

<style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body{
        font-family: Huninn, sans-serif;
        background-color: rgb(253, 220, 246);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    .card{
        background-color: rgb(203, 254, 254);
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 450px;
        width: 90%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px; /* 稍微縮小間距，讓加入音樂面板後高度剛剛好 */
    }

    h1{
        color: #640a2c;
        font-size: 1.8rem;
        transition: all 0.3s ease;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .dog_img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 15px;
        background: transparent;
        box-shadow: none;
        transition: transform 0.3s ease;
    }

    /* 🎵 新增：音樂播放控制區塊樣式 */
    .music-panel {
        background: rgba(255, 255, 255, 0.6);
        padding: 12px 18px;
        border-radius: 15px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .music-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        justify-content: center;
    }

    /* 可愛旋轉的播放按鈕 */
    #music-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background-color: #7a4646;
        color: white;
        border: none;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        padding: 0;
        transition: transform 0.2s ease, background-color 0.2s;
    }

    #music-btn:hover {
        background-color: #e2ba62;
    }

    /* 音樂正在播放時的旋轉動畫 */
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .music-note-spin {
        animation: spin 3s linear infinite;
    }

    /* 音量拉條樣式 */
    .volume-container {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .volume-container span {
        font-size: 0.85rem;
        color: #e2ba62;
    }

    #volume-slider {
        width: 100px;
        cursor: pointer;
        accent-color: #60312d; /* 拉條顏色改成粉紅色 */
    }

    /* 備註文字 */
    .music-tips {
        font-size: 0.8rem;
        color: #150271;
    }

    /* 按鈕容器 */
    .btn-container{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        width: 100%;
        min-height: 100px;
        position: relative;
    }

    button{
        padding: 12px 24px;
        font-size: 1.1rem;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s ease, background-color 0.2s ease;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    #btn-yes{
        background-color: azure;
        color: rgb(54, 12, 7);
        transition: transform 0.2s ease;
        z-index: 10;
    }

    #btn-no {
        background-color: #c2c9cb;
        color: #212121;
        transition: transform 0.2s ease;
    }

    #btn-no:hover{
        background-color: #aeaeae;
    }

    /* 成功畫面隱藏文字 */
    #success-text{
        font-size: 2rem;
        color: #640a2c;
        font-weight: bold;
        display: none;
        animation: heartBeat 1.2s infinite;
    }

    @keyframes heartBeat {
        0%{transform: scale(1);}
        14%{transform: scale(1.1);}
        28%{transform: scale(1);}
        42%{transform: scale(1.1);}
        70%{transform: scale(1);}
    }
</style>

<!-- 引入 Canvas-Confetti 碎花套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>


<body>
    <div class="card">
        <h1 id="title">要不要和我出去玩?</h1>    
        <h1 id="success-text">嘿嘿太棒了!愛你(✿＞_<)</h1>

        <audio id="bgm" src="bgm.mp3" loop></audio>

        <img id="dog_img" class="dog_img" src="asked_dog.png" alt="cutie puppy">
        
        <div class="music-panel" id="music-panel">
            <div class="music-controls">
                <button id="music-btn">▶︎</button>
                <div class="volume-container">
                    <span>🔇</span>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
                    <span>🔊</span>
                </div>
            </div>
            <div class="music-tips">★ 點擊聽音樂促進想跟我出去玩的心情!</div>
        </div>

        <div class="btn-container" id="btn-container">
            <button id="btn-yes">當然好呀</button>
            <button id="btn-no">我不要!</button>
        </div>
    </div>

<script>
    const title = document.getElementById('title');
    const successText = document.getElementById('success-text'); 
    const dogImg = document.getElementById('dog_img');           
    const btnContainer = document.getElementById('btn-container');
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');

    // 🔊 音樂與控制面板變數
    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const musicPanel = document.getElementById('music-panel');

    let isPlaying = false;
    let clickNoCount = 0;
    let yesScale = 1;
    let noScale = 1;

    // 設定預設音量（50%）
    bgm.volume = 0.5;

    // 🎵 音樂播放/暫停控制
    musicBtn.addEventListener('click', () => {
        if (isPlaying) {
            bgm.pause();
            musicBtn.textContent = '▶︎';
            musicBtn.classList.remove('music-note-spin'); // 停止旋轉
        } else {
            bgm.play().catch(err => console.log("播放失敗: ", err));
            musicBtn.textContent = '♫♪';
            musicBtn.classList.add('music-note-spin'); // 開始旋轉
        }
        isPlaying = !isPlaying;
    });

    // 🎚️ 音量拉條控制
    volumeSlider.addEventListener('input', (e) => {
        bgm.volume = e.target.value;
    });


   //點擊[當然好呀]
    btnYes.addEventListener('click', ()=>{
        // 如果剛才還沒放音樂，點擊「好呀」時也順便播放
        if (!isPlaying) {
            bgm.play().catch(e => console.log(e));
            musicBtn.textContent = '🎵';
            musicBtn.classList.add('music-note-spin');
            isPlaying = true;
        }

        title.style.display = 'none';
        btnContainer.style.display = 'none';
        musicPanel.style.display = 'none'; // 答應後把音樂控制面板也隱藏
        successText.style.display = 'block';
        dogImg.src = 'happy_dog.png'; 
        dogImg.style.transform = 'scale(1.1)';

        // 🎉 新增：滿螢幕愛心噴發特效！
        var duration = 5 * 1000; // 特效持續 5 秒
        var end = Date.now() + duration;

        (function frame() {
            // 從螢幕左邊偏下噴發
            confetti({
                particleCount: 3,
                angle: 60,
                spread: 55,
                origin: { x: 0, y: 0.8 },
                colors: ['#ff4081', '#ff80ab', '#ff1744', '#e91e63'] // 粉紅與紅色系
            });
            // 從螢幕右邊偏下噴發
            confetti({
                particleCount: 3,
                angle: 120,
                spread: 55,
                origin: { x: 1, y: 0.8 },
                colors: ['#ff4081', '#ff80ab', '#ff1744', '#e91e63']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    });

    // 點擊 [我不要!]
    btnNo.addEventListener('click', ()=>{
        // 安全起見，按鈕點擊時也確保音樂有在播放
        if (!isPlaying) {
            bgm.play().catch(e => console.log(e));
            musicBtn.textContent = '🎵';
            musicBtn.classList.add('music-note-spin');
            isPlaying = true;
        }

        clickNoCount++;

        // 🎉 1. 修改標題（台詞層層遞進）
        const dialogs = [
            '真的不想嗎(T_T)',
            '你知道嗎? 人活著需要呼吸',
            '我活著還需要和你出去玩',
            'nah求求你別再按了,我的心脆弱的像紙片,破防拆穿就低血糖,我要暈了我真的要暈了,我暈也不是因為我破防,而是因為我低血糖',
            '北鼻你只有一個選擇了( ᯣ _ ᯣ )'
        ];
        
        // 根據點擊次數選擇台詞，如果超過陣列長度，就一直顯示最後一句
        if (clickNoCount <= dialogs.length) {
            title.textContent = dialogs[clickNoCount - 1];
        } else {
            title.textContent = dialogs[dialogs.length - 1];
        }
        
        // 2. 修改圖片
        if(clickNoCount === 1){
            dogImg.src = 'confused_dog.png'; // 第一次點擊：換第二張
        } else {
            dogImg.src = 'sad_dog.png';      // 之後點擊：第三張難過
        }
        
        // 3. 按鈕比例調整
        yesScale += 0.3; // 越變越大
        noScale -= 0.15; // 越變越小

        btnYes.style.transform = `scale(${yesScale})`;
        
        if(noScale <= 0.1){
            // 如果按鈕小到一定程度，直接隱藏消失
            btnNo.style.display = 'none';
        } else {
            btnNo.style.transform = `scale(${noScale})`;
        }

        // 4. 按鈕隨機偏移亂動
        btnNo.style.position = 'fixed';

        // 計算隨機位置
        const padding = 100;
        const randomX = Math.floor(Math.random() * (window.innerWidth - padding * 2)) + padding;
        const randomY = Math.floor(Math.random() * (window.innerHeight - padding * 2)) + padding;

        btnNo.style.left = randomX + 'px';
        btnNo.style.top = randomY + 'px';
    });
</script>
</body>
</html>
